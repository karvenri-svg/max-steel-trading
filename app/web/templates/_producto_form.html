{% macro campos(p=None, catalogo=[]) %}
<div class="row"><div><label>Nombre *</label><input name="nombre" required value="{{ p.nombre if p else '' }}"></div>
<div><label>Línea</label><select name="linea">{% for l in ["Max Steel","Dragon Ball","Otro"] %}<option {{ 'selected' if p and p.linea==l }}>{{ l }}</option>{% endfor %}</select></div>
<div><label>Modelo (del catálogo)</label><input name="modelo" list="catalogo" value="{{ p.modelo or '' if p else '' }}">
<datalist id="catalogo">{% for c in catalogo %}<option value="{{ c.nombre }}">{% endfor %}</datalist></div>
<div><label>Año</label><input name="anio" type="number" value="{{ p.anio or '' if p else '' }}"></div>
<div><label>Estado físico</label><select name="estado_fisico">{% for e in ["sellado","caja_abierta","excelente","bueno","regular","malo","desconocido"] %}<option {{ 'selected' if p and p.estado_fisico.value==e }}>{{ e }}</option>{% endfor %}</select></div>
<div><label>Costo de adquisición *</label><input name="costo" required value="{{ p.costo_adquisicion if p else '' }}"></div>
<div><label>Precio mínimo (auto si vacío)</label><input name="precio_minimo" value="{{ p.precio_minimo or '' if p else '' }}"></div>
<div><label>Precio recomendado (auto si vacío)</label><input name="precio_recomendado" value="{{ p.precio_recomendado or '' if p else '' }}"></div>
<div><label>Fecha de compra</label><input type="date" name="fecha_compra" value="{{ p.fecha_compra.isoformat() if p and p.fecha_compra else '' }}"></div>
<div><label>Fotografía</label><input type="file" name="foto" accept="image/*"></div></div>
<label>Accesorios</label><input name="accesorios" value="{{ p.accesorios or '' if p else '' }}">
<label>Notas</label><textarea name="notas">{{ p.notas or '' if p else '' }}</textarea>
{% endmacro %}
